name: CI Gateway

on:
  push:
    branches:
      - main
    paths:
      - 'backend/gateway/**'
      - 'backend/erxes-api-shared/**'
      - '.github/workflows/ci-api-gateway.yml'
  pull_request:
    paths:
      - 'backend/gateway/**'
      - 'backend/erxes-api-shared/**'
      - '.github/workflows/ci-api-gateway.yml'

jobs:
  gateway-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24', '26']
    env:
      PUBLISH: ${{ matrix.node == '26' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install

      - name: Set environment variables
        run: |
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build shared module
        run: |
          export NX_DAEMON=false
          pnpm nx build erxes-api-shared

      - name: Build gateway
        run: |
          export NX_DAEMON=false
          pnpm nx build gateway

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: env.PUBLISH == 'true'
        run: |
          export NX_DAEMON=false
          pnpm nx docker-build gateway
          docker tag erxes/erxes-next-gateway erxes/erxes-next-gateway:latest
          docker tag erxes/erxes-next-gateway erxes/erxes-next-gateway:${{ github.sha }}
          docker push erxes/erxes-next-gateway:latest
          docker push erxes/erxes-next-gateway:${{ github.sha }}
