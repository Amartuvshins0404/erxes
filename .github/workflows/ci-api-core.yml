name: CI plugin--core-api

on:
  push:
    branches:
      - main
      - debug/core
    paths:
      - 'backend/core-api/**'
      - 'backend/erxes-api-shared/**'
      - '.github/workflows/ci-api-core.yml'
  pull_request:
    paths:
      - 'backend/core-api/**'
      - 'backend/erxes-api-shared/**'
      - '.github/workflows/ci-api-core.yml'

env:
  NX_DAEMON: false

jobs:
  core-api-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24', '26']
    env:
      PUBLISH: ${{ matrix.node == '26' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/debug/core') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Set environment variables
        run: |
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build shared module
        run: pnpm nx build erxes-api-shared

      - name: Build core-api
        run: pnpm nx build core-api

      - name: Set up QEMU
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.PUBLISH == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (multi-platform)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/core-api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            erxes/erxes-next-core-api:latest
            erxes/erxes-next-core-api:${{ env.DATE }}-${{ env.SHORT_SHA }}
